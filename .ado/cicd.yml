  - stage: PackageHelmChart
    displayName: Versioning of Helm Charts
    jobs:
      - job: create_helm_pkg
        displayName: Package helm charts and artifact.
        steps:
          - checkout: HelmCharts
            persistCredentials: true

          - checkout: self
            displayName: Checking out complete Repo

          - script: |
              yq eval '.version = "${{ parameters.version }}"' -i mlops-windoutput-helm/helm/${{ parameters.directoryPath }}-service/Chart.yaml
              yq eval '.appVersion = "${{ parameters.version }}"' -i mlops-windoutput-helm/helm/${{ parameters.directoryPath }}-service/Chart.yaml
              cat mlops-windoutput-helm/helm/${{ parameters.directoryPath }}-service/Chart.yaml
            displayName: "Updated ${{ parameters.directoryPath }} Chart.yaml"

          - task: HelmInstaller@1
            displayName: Helm installer
            inputs: 
              helmVersionToInstall: 3.16.3
          
          - script: |
              helm package mlops-windoutput-helm/helm/${{ parameters.directoryPath }}-service --destination mlops-windoutput-helm/helm/packages
              echo "Helm chart packaged successfully in 'mlops-windoutput-helm/helm/packages'"
            displayName: "Updated and Packaged ${{ parameters.directoryPath }} Helm Chart"

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: mlops-windoutput-helm/helm/packages
              artifactName: helm-chart-artifact
              publishLocation: Container

  - stage: PushFileToAnotherRepo
    jobs:
      - job: push_file
        steps:
          - checkout: HelmCharts
            persistCredentials: true
          - checkout: self
            displayName: Checking out complete Repo
            
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              artifactName: 'helm-chart-artifact'
              downloadPath: '$(Pipeline.Workspace)/helm-chart'
          
          - task: HelmInstaller@1
            displayName: Helm installer
            inputs: 
              helmVersionToInstall: 3.16.3

          - script: |
              cd helm-charts
              git status
              git config --global user.email pipeline@demo.com
              git config --global user.name "Pipeline"
              git checkout main || git checkout -b main
              
              # Check if the artifact file exists
              if [ -f "$(Pipeline.Workspace)/helm-chart/helm-chart-artifact/${{ parameters.directoryPath }}-service-${{ parameters.version }}.tgz" ]; then
                  echo "File found. Copying to the target directory..."
                  mkdir -p ${{ parameters.directoryPath }}
                  cp "$(Pipeline.Workspace)/helm-chart/helm-chart-artifact/${{ parameters.directoryPath }}-service-${{ parameters.version }}.tgz" ${{ parameters.directoryPath }}/
                  echo "File successfully copied"
              else
                  echo "File ${{ parameters.directoryPath }}-service-${{ parameters.version }}.tgz not found in artifact"
                  exit 1
              fi
              helm repo index ${{ parameters.directoryPath }} --url https://analyst-amit.github.io/helm-charts/${{ parameters.directoryPath }}
              git add -A
              git commit -m "Added latest ${{ parameters.directoryPath }} file"
              git push -u origin main
            displayName: Create, Commit, and Push




